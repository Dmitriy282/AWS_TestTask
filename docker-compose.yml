name: aws-testtask

# Shared hit counter: every app connects to the same Redis
x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  HITS_TTL: ${HITS_TTL:-259200}   # 3 days

services:
  # ---------- web ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PHP_PORT:-80}:80"          # Site 1 — PHP
      - "${PYTHON_PORT:-8000}:8000"   # Site 2 — Flask
      - "${NODE_PORT:-8080}:8080"     # Site 3 — Node.js
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php/public:/var/www/html:ro
    depends_on:
      - php
      - python
      - node
    networks:
      - web
    restart: unless-stopped

  php:
    build: ./php
    volumes:
      - ./php/public:/var/www/html:ro
    environment:
      <<: *redis-env
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - db
    restart: unless-stopped

  python:
    build: ./python
    environment:
      <<: *redis-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - db
    restart: unless-stopped

  node:
    build: ./node
    environment:
      <<: *redis-env
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - db
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web
      - db
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - db
    restart: unless-stopped

  # ---------- db ----------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_DATABASES: ${POSTGRES_EXTRA_DATABASES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}   # read by redis-cli (healthcheck, manual checks)
    # AOF keeps the counters (and their TTL) across restarts; the counters are tiny, 64 MB is plenty
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --maxmemory 64mb"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db
    restart: unless-stopped

networks:
  web:
  db:
    internal: true   # no internet access, no published ports — reachable only from containers on this network

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  pgadmin_data:
  redis_data:
