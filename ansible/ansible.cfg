[defaults]
# every file here is read: aws.ini (written by Terraform) + baremetal.ini (written by hand)
inventory = inventory
# skip the *.example templates in inventory/
inventory_ignore_extensions = ~, .orig, .bak, .cfg, .retry, .pyc, .pyo, .md, .txt, .example
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
# a new server has a new host key: accept it on first connect, but still reject a changed one
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
