- name: Create the project directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy the project files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_dir }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rwX,g=rX,o=rX
  loop: "{{ app_sources }}"
  register: app_files

# ---------- .env ----------
# The passwords are generated by Terraform and kept only in Vault; the server gets them in .env
- name: Read the passwords from Vault
  ansible.builtin.set_fact:
    app_secrets: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_app_path, engine_mount_point=vault_mount, url=vault_addr).secret }}"
  no_log: true

- name: Write .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true   # the values are passwords

# ---------- run ----------
- name: Build and start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    # rebuild the app images only when their files changed
    build: "{{ 'always' if app_files is changed else 'policy' }}"
    pull: missing
    remove_orphans: true
    wait: true          # until every container is running / healthy
    wait_timeout: 900   # the first start on t3.micro (with swap) is slow

- name: Check that the sites and their databases answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}"
  loop:
    - "{{ php_port }}/db.php"
    - "{{ python_port }}/db"
    - "{{ node_port }}/db"
  register: app_site_check
  until: app_site_check.status == 200
  retries: 20
  delay: 5

- name: Read the shared hit counter
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ python_port }}/hits"
  register: app_hits

- name: Show the hit counter
  ansible.builtin.debug:
    msg: "{{ app_hits.json }}"
