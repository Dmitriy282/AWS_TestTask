# Settings written to .env on the server. The passwords are not here:
# they are read from Vault (vault_app_path) and added to these in templates/env.j2.
app_env:
  # MySQL (PHP)
  MYSQL_DATABASE: app
  MYSQL_USER: app
  # PostgreSQL (Python). pgadmin/servers.json expects POSTGRES_USER=app
  POSTGRES_DB: app
  POSTGRES_EXTRA_DATABASES: reports
  POSTGRES_USER: app
  # MongoDB (Node.js)
  MONGO_USER: app
  # Redis — shared hit counter
  HITS_TTL: "{{ hits_ttl }}"
  # pgAdmin login
  PGADMIN_EMAIL: "{{ pgadmin_email }}"
  # Published host ports
  PHP_PORT: "{{ php_port }}"
  PYTHON_PORT: "{{ python_port }}"
  NODE_PORT: "{{ node_port }}"
  PHPMYADMIN_PORT: "{{ phpmyadmin_port }}"
  PGADMIN_PORT: "{{ pgadmin_port }}"
