# Where the project lives on the server
app_dir: "/home/{{ ansible_user }}/AWS_TestTask"

# What is copied from the repository root to app_dir
app_sources:
  - docker-compose.yml
  - nginx
  - php
  - python
  - node
  - postgres
  - pgadmin

# t3.micro has 1 GB of RAM — not enough for three databases + pgAdmin without swap.
# 0 — no swap file (set per host in the inventory, e.g. for a bare-metal server with enough RAM)
swap_size_mb: 2048

# The images take about 8 GB; checked only before the first Docker install
min_free_disk_gb: 10

# Published host ports (written to .env)
php_port: 80
python_port: 8000
node_port: 8080
phpmyadmin_port: 8081
pgadmin_port: 8082

pgadmin_email: admin@example.com

# Vault with the secrets, written by Terraform (../terraform/vault.tf). The token comes from VAULT_TOKEN
vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('http://127.0.0.1:8200', true) }}"
vault_mount: secret
vault_ssh_path: aws-testtask/ssh   # SSH key of the EC2 instance
vault_app_path: aws-testtask/app   # passwords of the stack

# Hit counter TTL in seconds (3 days)
hits_ttl: 259200
