# Configure the servers of the `app` group and start the whole stack.
# The servers must already exist: an EC2 instance created by Terraform (../terraform) or your own bare-metal server.
# Safe to run again: only what changed is applied.
#   ansible-playbook site.yml                    # all servers
#   ansible-playbook site.yml --limit aws        # only the EC2 instance
#   ansible-playbook site.yml --limit baremetal  # only your own servers
- name: Deploy AWS_TestTask
  hosts: app
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait until the server accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish (a fresh cloud instance runs apt on first boot; no-op without cloud-init)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    - name: Check the OS
      ansible.builtin.assert:
        that: ansible_facts.distribution in ['Ubuntu', 'Debian']
        fail_msg: "Only Ubuntu and Debian are supported, this is {{ ansible_facts.distribution }}"
        quiet: true

  roles:
    - base
    - docker
    - app
